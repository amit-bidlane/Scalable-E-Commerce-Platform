[project]
name = "scalable-ecommerce-platform"
version = "0.1.0"
description = "Production-ready FastAPI backend for a scalable e-commerce platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<0.130.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "setuptools<81",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-jose[cryptography]>=3.4.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.20,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "redis>=5.2.0,<6.0.0",
    "stripe>=12.0.0,<13.0.0",
    "razorpay>=1.4.2,<2.0.0",
    "aio-pika>=9.5.0,<10.0.0",
    "python-json-logger>=3.2.1,<4.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0,<7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.1.1,<7.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=71"
