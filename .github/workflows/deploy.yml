name: Build And Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_VERSION: "3.13"
      PROJECT_NAME: Scalable E-Commerce Platform
      API_V1_STR: /api/v1
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_test
      JWT_SECRET_KEY: test-secret
      JWT_REFRESH_SECRET_KEY: test-refresh-secret
      RATE_LIMIT_PER_MINUTE: "100"
      REDIS_URL: redis://localhost:6379/0
      PAYMENT_PROVIDER: razorpay
      PAYMENT_CURRENCY: INR
      ENABLE_METRICS: "true"
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DB: ecommerce_test
      TEST_REDIS_URL: redis://localhost:6379/5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==0.13.6

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --extra dev --python "$PYTHON_VERSION"

      - name: Apply migrations to the empty test database
        run: uv run --no-sync alembic upgrade head

      - name: Run pytest with coverage gate
        run: uv run --no-sync pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: scalable-ecommerce-platform:ci

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.ref == 'refs/heads/main' }}
    # One deploy at a time, so two quick pushes cannot run two SSH sessions on the host together.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      AWS_EC2_USERNAME: ${{ secrets.AWS_EC2_USERNAME }}
      AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
    steps:
      - name: Simulate deployment when SSH secrets are missing
        if: ${{ env.AWS_EC2_HOST == '' || env.AWS_EC2_USERNAME == '' || env.AWS_EC2_SSH_KEY == '' }}
        run: echo "Skipping EC2 deployment because SSH secrets are not configured."

      - name: Deploy to AWS EC2 over SSH
        if: ${{ env.AWS_EC2_HOST != '' && env.AWS_EC2_USERNAME != '' && env.AWS_EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/scalable-ecommerce-platform
            git fetch origin
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "The host has local changes to tracked files. Refusing to deploy."
              exit 1
            fi
            git checkout --detach ${{ github.sha }}
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "The host is on $(git rev-parse HEAD), not on ${{ github.sha }}. Refusing to continue."
              exit 1
            fi
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
