name: Build And Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_VERSION: "3.11"
      PROJECT_NAME: Scalable E-Commerce Platform
      API_V1_STR: /api/v1
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_test
      JWT_SECRET_KEY: test-secret
      JWT_REFRESH_SECRET_KEY: test-refresh-secret
      RATE_LIMIT_PER_MINUTE: "100"
      REDIS_URL: redis://localhost:6379/0
      PAYMENT_PROVIDER: razorpay
      PAYMENT_CURRENCY: INR
      ENABLE_METRICS: "true"
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DB: ecommerce_test
      TEST_REDIS_URL: redis://localhost:6379/5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==0.13.6

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --extra dev --python "$PYTHON_VERSION"

      - name: Apply migrations to the empty test database
        run: uv run --no-sync alembic upgrade head

      - name: Run pytest with coverage gate
        run: uv run --no-sync pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ github.repository }}:latest

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/scalable-ecommerce-platform:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.ref == 'refs/heads/main' }}
    env:
      AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
      AWS_EC2_USERNAME: ${{ secrets.AWS_EC2_USERNAME }}
      AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
    steps:
      - name: Simulate deployment when SSH secrets are missing
        if: ${{ env.AWS_EC2_HOST == '' || env.AWS_EC2_USERNAME == '' || env.AWS_EC2_SSH_KEY == '' }}
        run: echo "Skipping EC2 deployment because SSH secrets are not configured."

      - name: Deploy to AWS EC2 over SSH
        if: ${{ env.AWS_EC2_HOST != '' && env.AWS_EC2_USERNAME != '' && env.AWS_EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd /opt/scalable-ecommerce-platform
            docker compose pull
            docker compose up -d --build
